title: Export Nomenclatures Excel
tooltip: >
  Exporte les nomenclatures Revit sélectionnées vers un fichier Excel (.xlsx).
  Un onglet par nomenclature, plus un onglet Resume avec les infos du projet.
  Sélection multiple avec filtre par nom, dossier mémorisé entre les sessions.
